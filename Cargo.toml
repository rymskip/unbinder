[package]
name = "unbinder"
version = "0.2.0"
edition = "2024"
authors = ["rymskip <38576440+rymskip@users.noreply.github.com>"]
description = "A high-performance JSON Schema dereferencer for resolving $ref pointers"
documentation = "https://docs.rs/unbinder"
homepage = "https://github.com/rymskip/unbinder"
repository = "https://github.com/rymskip/unbinder"
license = "MIT"
readme = "README.md"
keywords = ["json-schema", "dereference", "ref", "wasm", "no-std"]
categories = ["web-programming", "wasm", "no-std", "parser-implementations"]
exclude = [
    "/.dockerignore",
    "/bench",
    "/bun.lock",
    "/package.json",
    "/pixi.lock",
    "/pixi.toml",
    "/scripts",
    "/tests/js",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
percent-encoding = { version = "2.3.2", default-features = false, features = [
    "alloc",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
    "alloc",
] }

serde = { version = "1.0.229", default-features = false, features = [
    "alloc",
] }

# ── JavaScript bindings ───────────────────────────────
js-sys = { version = "0.3.106", optional = true }
tsify = { version = "0.5.8", default-features = false, features = [
    "js",
], optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }

[dev-dependencies]
proptest = "1.12.0"

[features]
default = ["std"]
std = ["percent-encoding/std", "serde/std", "serde_json/std"]
wasm = [
    "std",
    "dep:js-sys",
    "serde/derive",
    "dep:tsify",
    "dep:wasm-bindgen",
]

[[bench]]
name = "native"
harness = false

[profile.release]
lto = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# No panics outside a proven invariant.
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

# No failure turned into absence. `clippy.toml` bans the methods that do it.
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"

# Numeric conversions and overflow are explicit.
arithmetic_side_effects = "deny"
as_conversions = "deny"

# A new variant must be handled at every match.
wildcard_enum_match_arm = "deny"

# Names say what they hold. `clippy.toml` removes the single-letter allowance.
min_ident_chars = "deny"
single_char_lifetime_names = "deny"

# A suppression is an `#[expect]` with a reason, so it expires.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The crate builds without `std`.
alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

clone_on_ref_ptr = "deny"
dbg_macro = "deny"
exit = "deny"
infinite_loop = "deny"
mem_forget = "deny"
print_stderr = "deny"
print_stdout = "deny"
